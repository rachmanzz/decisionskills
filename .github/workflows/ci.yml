name: Validate decision-history

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check skills/decision-history/scripts tests

      - name: Run mypy
        run: mypy skills/decision-history/scripts tests

      - name: Validate repository decision history
        run: python skills/decision-history/scripts/validate_decisions.py --root . --require-integrity --require-history

      - name: Compare decision history with pull request base
        if: github.event_name == 'pull_request'
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: python skills/decision-history/scripts/validate_decisions.py --root . --require-integrity --require-history --against-git-ref "$BASELINE_REF"

      - name: Compare decision history with previous push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && !github.event.deleted
        env:
          BASELINE_REF: ${{ github.event.before }}
        run: python skills/decision-history/scripts/validate_decisions.py --root . --require-integrity --require-history --against-git-ref "$BASELINE_REF"
