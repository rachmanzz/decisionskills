name: Validate decision-history

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check skills/decision-history/scripts tests

      - name: Run mypy
        run: mypy skills/decision-history/scripts tests

      - name: Validate repository decision history
        run: python skills/decision-history/scripts/validate_decisions.py --root . --require-integrity
