name: Validate decision-history

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff
        run: ruff check skills/decision-history/scripts tests

      - name: Run mypy
        run: mypy skills/decision-history/scripts tests

      - name: Validate repository decision history
        run: python skills/decision-history/scripts/validate_decisions.py --root . --require-integrity
